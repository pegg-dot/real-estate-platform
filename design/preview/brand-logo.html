<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card-grid">
  <div class="row" style="align-items:center;gap:30px;">
    <div style="display:flex;align-items:center;gap:13px;">
      <img src="../assets/lot-mark.svg" width="46" height="46" alt="LOT mark">
      <div>
        <div style="font-family:var(--font-display);font-size:26px;font-weight:500;letter-spacing:.01em;line-height:1;">LOT</div>
        <div style="font-size:11px;color:var(--text-tertiary);font-family:var(--font-mono);margin-top:3px;">Land of Opportunity Terminal</div>
      </div>
    </div>
    <div style="display:flex;gap:14px;align-items:center;">
      <img src="../assets/lot-mark.svg" width="30" height="30" alt="">
      <img src="../assets/lot-mark.svg" width="20" height="20" alt="">
    </div>
    <div class="live" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;">
      <span style="width:7px;height:7px;border-radius:50%;background:var(--positive);"></span> live
    </div>
  </div>
  <div class="cap">A topographic mark — contour lines rising from a clay edge to a green "peak," the way elevation reads on a real map. Organic, land-native, no glow. Wordmark in the Newsreader serif.</div>
</div>
</body>
</html>
