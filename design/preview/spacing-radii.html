<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card-grid">
  <div class="row" style="gap:18px;align-items:flex-end;">
    <div><div style="width:58px;height:46px;background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:3px;"></div><div class="lbl">xs · 3px</div></div>
    <div><div style="width:58px;height:46px;background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:5px;"></div><div class="lbl">sm · 5px<br>buttons, chips</div></div>
    <div><div style="width:58px;height:46px;background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:7px;"></div><div class="lbl">md · 7px<br>panels, cards</div></div>
    <div><div style="width:58px;height:46px;background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:10px;"></div><div class="lbl">lg · 10px<br>map cards</div></div>
    <div><div style="width:46px;height:46px;background:var(--accent);border-radius:50%;box-shadow:0 0 14px var(--accent-glow);"></div><div class="lbl">pill · round<br>map controls, dots</div></div>
  </div>
  <div class="cap">Tight, technical radii — the terminal reads precise, not bubbly. Map controls and status dots go fully round.</div>
</div>
</body>
</html>
