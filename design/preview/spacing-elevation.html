<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card-grid">
  <div class="row" style="gap:24px;align-items:flex-start;padding:4px;">
    <div><div style="width:86px;height:52px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:10px;"></div><div class="lbl">flat<br>hairline only</div></div>
    <div><div style="width:86px;height:52px;background:var(--bg-elevated);border-radius:10px;box-shadow:var(--shadow-md);"></div><div class="lbl">md · raised</div></div>
    <div><div style="width:86px;height:52px;background:var(--bg-elevated);border-radius:14px;box-shadow:var(--shadow-float);"></div><div class="lbl">float · map card</div></div>
    <div><div style="width:52px;height:52px;margin:0 18px;background:var(--bg-panel);border:1px solid var(--accent);border-radius:10px;box-shadow:var(--glow-accent);"></div><div class="lbl">focus<br>soft clay ring</div></div>
  </div>
  <div class="cap">Warm, soft elevation — deeper shadow plus a faint hairline, never neon. Focus is a gentle clay ring. Most surfaces float on shadow alone.</div>
</div>
</body>
</html>
