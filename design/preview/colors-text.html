<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card-grid">
  <div class="row" style="gap:18px;">
    <div><div class="swatch" style="width:64px;height:50px;background:var(--text-primary);"></div><div class="lbl">primary<br>#eef2f7</div></div>
    <div><div class="swatch" style="width:64px;height:50px;background:var(--text-secondary);"></div><div class="lbl">secondary<br>#9fabbb</div></div>
    <div><div class="swatch" style="width:64px;height:50px;background:var(--text-tertiary);"></div><div class="lbl">tertiary<br>#62718a</div></div>
    <div><div class="swatch" style="width:64px;height:50px;background:var(--accent-bright);"></div><div class="lbl">link / accent<br>#57a6ff</div></div>
  </div>
  <div style="background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:7px;padding:12px 14px;">
    <span style="color:var(--text-primary);font-weight:600;">Primary near-white</span> ·
    <span style="color:var(--text-secondary);">secondary supporting copy</span> ·
    <span style="color:var(--text-tertiary);">tertiary hint</span> ·
    <a href="#">accent link</a> ·
    <span style="font-family:var(--font-mono);color:var(--text-primary);">APN&nbsp;040303000</span>
  </div>
  <div class="cap">Cool near-whites stepping down to muted slate. Mono carries IDs and data values throughout.</div>
</div>
</body>
</html>
