<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card-grid">
  <div class="row" style="gap:34px;">
    <div><span style="font-size:16px;font-weight:400;">Regular</span><div class="lbl">400 · body</div></div>
    <div><span style="font-size:16px;font-weight:500;">Medium</span><div class="lbl">500 · row emphasis</div></div>
    <div><span style="font-size:16px;font-weight:600;">Semibold</span><div class="lbl">600 · titles, values</div></div>
    <div><span style="font-size:16px;font-weight:700;">Bold</span><div class="lbl">700 · eyebrows, severity</div></div>
  </div>
  <div style="border-top:1px solid var(--border-soft);padding-top:12px;">
    <div class="eyebrow">WHY THIS SCORE</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">The uppercase, letter-spaced eyebrow (11px / 700 / 0.06em) titles every panel section and tab. It and the severity badges are where 700 lives.</div>
  </div>
</div>
