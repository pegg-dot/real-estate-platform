<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card-grid">
  <div class="row" style="gap:14px;align-items:flex-end;">
    <div><div style="width:4px;height:34px;background:var(--accent);"></div><div class="lbl">1·4</div></div>
    <div><div style="width:8px;height:34px;background:var(--accent);"></div><div class="lbl">2·8</div></div>
    <div><div style="width:12px;height:34px;background:var(--accent);"></div><div class="lbl">3·12</div></div>
    <div><div style="width:16px;height:34px;background:var(--accent);"></div><div class="lbl">4·16</div></div>
    <div><div style="width:20px;height:34px;background:var(--accent);"></div><div class="lbl">5·20</div></div>
    <div><div style="width:24px;height:34px;background:var(--accent);"></div><div class="lbl">6·24</div></div>
    <div><div style="width:32px;height:34px;background:var(--accent);"></div><div class="lbl">8·32</div></div>
  </div>
  <div class="cap">4px base. The terminal runs dense — panels pad 12–14px, rows sit on 7–8px gaps. Information-rich, deliberately tight.</div>
</div>
</body>
</html>
