<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card-grid">
  <div class="row">
    <div><div class="swatch" style="width:104px;height:54px;background:var(--bg-chrome);"></div><div class="lbl">chrome<br>#0e141b</div></div>
    <div><div class="swatch" style="width:104px;height:54px;background:var(--bg-base);"></div><div class="lbl">base canvas<br>#141b24</div></div>
    <div><div class="swatch" style="width:104px;height:54px;background:var(--bg-panel);"></div><div class="lbl">panel<br>#1b2530</div></div>
    <div><div class="swatch" style="width:104px;height:54px;background:var(--bg-panel-2);"></div><div class="lbl">panel-2 / hover<br>#222e3b</div></div>
    <div><div class="swatch" style="width:104px;height:54px;background:var(--bg-elevated);"></div><div class="lbl">elevated<br>#283543</div></div>
  </div>
  <div class="cap">Dark blue-slate surfaces, layered by elevation. Deepest chrome at the edges; panels and wells rise toward the user.</div>
</div>
</body>
</html>
