<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card-grid">
  <div class="row" style="gap:16px;">
    <div><div class="swatch" style="width:74px;height:46px;background:var(--accent);box-shadow:0 0 14px var(--accent-glow);"></div><div class="lbl">accent / cmd<br>#3d8bf0</div></div>
    <div><div class="swatch" style="width:74px;height:46px;background:var(--critical);"></div><div class="lbl">critical<br>#f0655a</div></div>
    <div><div class="swatch" style="width:74px;height:46px;background:var(--warn);"></div><div class="lbl">warn<br>#e6a44f</div></div>
    <div><div class="swatch" style="width:74px;height:46px;background:var(--positive);"></div><div class="lbl">positive<br>#46c08a</div></div>
    <div><div class="swatch" style="width:74px;height:46px;background:var(--landmark);"></div><div class="lbl">landmark<br>#8a7dff</div></div>
  </div>
  <div class="cap">Cyan-blue is the command color (actions, active state, glow). Critical flags regulatory-kill; warn = attorney triggers; positive = real-data/cash; violet marks the UVA landmark.</div>
</div>
</body>
</html>
