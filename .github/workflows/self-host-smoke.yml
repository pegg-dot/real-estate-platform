name: self-host-verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Audit root Node dependency lockfile
        run: npm audit --package-lock-only --audit-level=high

      - name: Audit web dependency lockfile
        working-directory: web
        run: npm audit --package-lock-only --audit-level=high

      - name: Build and start the zero-config stack
        run: docker compose up -d --build --wait --wait-timeout 420

      - name: Verify database health and migration state
        run: |
          curl -fsS http://localhost:3000/api/health | tee health.json; echo
          expected=$(ls supabase/migrations/*.sql | wc -l | tr -d ' ')
          got=$(jq -r '.migrations' health.json)
          test "$(jq -r '.ok' health.json)" = "true"
          test "$got" = "$expected" || { echo "expected $expected migrations recorded, got $got"; exit 1; }

      - name: Verify migrations are idempotent after restart
        run: |
          docker compose restart app
          docker compose up --wait --wait-timeout 180 app
          docker compose logs app | grep -q "database is up to date"

      - name: Logs
        if: failure()
        run: docker compose logs --no-color | tail -300

      - name: Tear down
        if: always()
        run: docker compose down -v
