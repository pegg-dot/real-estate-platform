name: dependency-refresh-once

on:
  push:
    branches: [public/portfolio-self-hosting]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[dependency-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: public/portfolio-self-hosting
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply safe root dependency fixes
        run: npm audit fix --ignore-scripts
      - name: Apply safe web dependency fixes
        working-directory: web
        run: npm audit fix --ignore-scripts
      - name: Prove high-severity audit is clean
        run: |
          npm audit --package-lock-only --audit-level=high
          (cd web && npm audit --package-lock-only --audit-level=high)
      - name: Commit refreshed manifests and lockfiles
        run: |
          if git diff --quiet -- package.json package-lock.json web/package.json web/package-lock.json; then
            echo "No dependency changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json web/package.json web/package-lock.json
          git commit -m "Refresh dependency security fixes [dependency-refresh]"
          git push origin HEAD:public/portfolio-self-hosting
