name: weekly-refresh

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      market:
        description: "Market name"
        default: "Charlottesville"
      limit:
        description: "Max parcels to ingest"
        default: "20000"

permissions:
  contents: read

# A live refresh writes to one configured database. Queue overlapping runs instead of allowing
# two schedulers to mutate the same market state at the same time.
concurrency:
  group: lot-weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Guard optional live refresh
        id: guard
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not configured; skipping the optional live refresh."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: |
          npm ci
          pip install --disable-pip-version-check -r ingestion/requirements.txt

      - name: Validate dispatch inputs
        if: steps.guard.outputs.enabled == 'true'
        env:
          MARKET: ${{ github.event.inputs.market || 'Charlottesville' }}
          LIMIT: ${{ github.event.inputs.limit || '20000' }}
        run: |
          case "$LIMIT" in
            ''|*[!0-9]*) echo "limit must be an integer"; exit 1 ;;
          esac
          if [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 50000 ]; then
            echo "limit must be between 1 and 50000"
            exit 1
          fi
          if [ -z "$MARKET" ] || [ "${#MARKET}" -gt 80 ]; then
            echo "market is invalid"
            exit 1
          fi

      - name: Run market refresh
        if: steps.guard.outputs.enabled == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKET: ${{ github.event.inputs.market || 'Charlottesville' }}
          LIMIT: ${{ github.event.inputs.limit || '20000' }}
        run: npm run refresh -- --market "$MARKET" --limit "$LIMIT" --no-history
