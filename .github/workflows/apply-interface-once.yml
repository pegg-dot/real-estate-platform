name: apply-interface-once
on:
  push:
    branches: [design/acquisition-workspace]
    paths: [.github/workflows/apply-interface-once.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.actor == 'pegg-dot'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify and apply exact source snapshot
        run: |
          test "$(git rev-parse HEAD^)" = debfde557550f67bf8cc93ce1f8a184cee794390
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, urllib.request
          shas = ['5d6c85a0abe6487e2d14de64e77353447ed28fea', '6299a15d496240a5b5c889b167a6bc6e90257179', '12236b37552fa869c11792ab39331914a49d08b0', 'c795f74a4bd9e7f4e86fba7135d016a00e6572ea']
          chunks = []
          for sha in shas:
              req = urllib.request.Request('https://api.github.com/repos/pegg-dot/real-estate-platform/git/blobs/' + sha, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'lot-interface-snapshot'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  blob = json.load(response)
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          raw = lzma.decompress(b''.join(chunks))
          assert hashlib.sha256(raw).hexdigest() == '76403885c09a72d76e9d237db800b23b67744e488c8b7d08237d05d471a2317b'
          files = json.loads(raw)
          assert len(files) == 28
          root = pathlib.Path.cwd().resolve()
          for name, content in files.items():
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name == '.gitignore' or name == 'docs/interface-design.md' or name.startswith(('web/app/', 'tests/browser/', 'tests/interface/'))
              target = root / path
              assert not target.is_symlink() and target.resolve().is_relative_to(root)
              assert isinstance(content, str)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
          pathlib.Path('/tmp/lot-snapshot-paths').write_bytes(b'\0'.join(name.encode() for name in files) + b'\0')
          print('Applied 28 files with verified snapshot checksum.')
          PY
      - name: Verify the implementation
        run: |
          npm ci --no-fund
          npm ci --prefix web --no-fund
          npm run typecheck
          npm test
          npm run lint --prefix web
          npm run build --prefix web
      - name: Commit only verified interface files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs -0 git add -- < /tmp/lot-snapshot-paths
          git diff --cached --stat
          git commit -m 'Rebuild LOT as a focused acquisition workspace'
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin HEAD:design/acquisition-workspace
