name: design-workspace-once
on:
  push:
    branches: [design/acquisition-workspace]
    paths: [.github/workflows/design-workspace-once.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare source and locked dependencies for offline visual development
        run: |
          git archive --format=tar.gz HEAD > /tmp/lot-source.tar.gz
          npm ci --no-fund
          npm ci --prefix web --no-fund
          tar -czf /tmp/lot-dependencies.tar.gz node_modules web/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot-design-source
          path: /tmp/lot-source.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot-design-dependencies
          path: /tmp/lot-dependencies.tar.gz
          compression-level: 0
          retention-days: 1
