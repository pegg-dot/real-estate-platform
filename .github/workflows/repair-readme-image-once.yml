name: repair-readme-image-once

on:
  push:
    branches: [fix/readme-screenshot]
    paths: [.github/workflows/repair-readme-image-once.yml]

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore screenshot from verified main interface artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10114246569/zip > /tmp/interface-evidence.zip
          rm -rf /tmp/interface-evidence
          mkdir -p /tmp/interface-evidence
          unzip -q /tmp/interface-evidence.zip -d /tmp/interface-evidence
          test -f /tmp/interface-evidence/overview-desktop.png
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          src = Path('/tmp/interface-evidence/overview-desktop.png')
          data = src.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (1440, 1101), (width, height)
          print('verified', width, height, hashlib.sha256(data).hexdigest())
          Path('docs/screenshots/overview-workspace.png').write_bytes(data)
          PY
          git rm .github/workflows/repair-readme-image-once.yml
          git diff --check
      - name: Commit exact repaired image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/overview-workspace.png
          git commit -m 'Fix README acquisition workspace screenshot'
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin HEAD:fix/readme-screenshot
