name: web-lock-refresh-once

on:
  push:
    branches: [public/portfolio-self-hosting]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[web-lock-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: public/portfolio-self-hosting
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regenerate patched web dependency lock
        working-directory: web
        run: |
          npm install --ignore-scripts
          npm audit fix --ignore-scripts || true
          npm audit --package-lock-only --audit-level=high
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          if git diff --cached --quiet; then
            echo "Web lockfile already matches the manifest."
            exit 0
          fi
          git commit -m "Refresh web dependency lock [web-lock-refresh]"
          git push origin HEAD:public/portfolio-self-hosting
